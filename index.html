.nm{width:100%;margin-top:6px;background:none;border:1px dashed var(--ac);color:var(--ac)}

pc.appendChild(bx)});

async function aceptar(g){const s=S[g.m],m=s&&s.p[g.k]&&s.p[g.k].m[g.mi];
if(!m){msg("Ese modelo ya no existe. Rechaza la sugerencia.");return}

else{const j=m.q.findIndex(q=>qt(q)===g.viejo);if(j<0){msg("La pregunta original ya cambió o no existe. Rechaza la sugerencia.");return}

const rows=t=>t.trim().split("\n").map(l=>l.split("|")),YR={1:"1er año",2:"2do año",3:"3er año",4:"4to año"};
function grp(rs,mk){const g=[];rs.forEach(r=>{let x=g.find(y=>y.d===r[0]);if(!x)g.push(x={d:r[0],items:[]});x.items.push(mk(r))});return g}
const SEED={aulas:()=>({g:grp(rows(AU),r=>({a:YR[r[1]]||r[1],m:r[2],h:r[3],r:r[4]}))}),
guia:()=>({g:grp(rows(ES),r=>({a:YR[r[1]],m:r[2],n:r[3]||""})),reg:rows(RG).map(r=>({t:r[0],tag:r[1],x:r[2]})),cho:rows(CH).map(r=>({t:r[0],x:r[1]}))})};
const FA=[["a","Año (ej. 1er año)"],["m","Materia"],["h","Horario"],["r","Aula"]],FE=[["a","Año (ej. 1er año)"],["m","Materia"],["n","Nota (ej. + Mié)"]],FR=[["t","Título"],["tag","Etiqueta (REGLA, TIP…)"],["x","Texto"]],FC=[["t","Título"],["x","Texto"]];
const yt=a=>el("span","yt y"+(parseInt(a)||0),a||"");
const shA=(it,j,v)=>v.append(yt(it.a),document.createTextNode(" "+(it.m||"")),el("br"),el("small",null,[it.h,it.r].filter(Boolean).join(" · ")));
const shE=(it,j,v)=>v.append(yt(it.a),document.createTextNode(" "+(it.m||"")+(it.n?" ("+it.n+")":"")));
const shR=(it,j,v)=>{v.append(el("b",null,String(j+1).padStart(2,"0")+" "+(it.t||"")));if(it.tag)v.append(el("small",null," · "+it.tag));v.append(el("br"),document.createTextNode(it.x||""))};
const shC=(it,j,v)=>v.append(el("b",null,it.t||""),el("br"),document.createTextNode(it.x||""));
function saveX(k){const {id,...r}=X[k];setDoc(doc(db,"materias","x_"+k),r).catch(e=>msg("No se pudo guardar: "+e.code))}
function listUI(arr,F,show,sv){const box=el("div");
arr.forEach((it,j)=>{const li=el("div","it"),v=el("div","iv");show(it,j,v);li.appendChild(v);
if(ADMIN){const e=el("button","x mv","✎");e.onclick=()=>{if(v.querySelector(".ti")){renderX();return}
v.textContent="";const ins=F.map(([k,l])=>{const i=el(k==="x"?"textarea":"input","ti");if(k==="x")i.rows=4;i.placeholder=l;i.value=it[k]||"";v.appendChild(i);return[k,i]});
const b=el("button","nm","Guardar");b.onclick=()=>{ins.forEach(([k,i])=>{it[k]=i.value.trim()});sv()};v.appendChild(b)};
const d=el("button","x","✕");d.onclick=()=>two(d,"✕",()=>{arr.splice(j,1);sv()});li.append(e,d);
box.appendChild(li);if(F.every(([k])=>!it[k]))e.onclick();return}
box.appendChild(li)});
if(ADMIN){const a=el("button","nm","+ Añadir");a.onclick=()=>{arr.push(Object.fromEntries(F.map(([k])=>[k,""])));sv()};box.appendChild(a)}
return box}
function groups(key,garr,F,show){const sv=()=>saveX(key),w=el("div");
garr.forEach((g,gi)=>{const k="g"+key+gi,d=el("details","pd");d.open=OP.has(k);d.ontoggle=tg(d,k);
d.appendChild(el("summary","ps",g.d+" · "+g.items.length));const c=el("div");
if(ADMIN){const h=el("div","mh"),n=el("input","yr");n.value=g.d;n.onchange=()=>{g.d=n.value.trim()||g.d;sv()};
const x=el("button","x","🗑");x.title="Eliminar grupo";x.onclick=()=>two(x,"🗑",()=>{garr.splice(gi,1);sv()});h.append(n,x);c.appendChild(h)}
c.appendChild(listUI(g.items,F,show,sv));d.appendChild(c);w.appendChild(d)});
if(ADMIN){const a=el("button","nm","+ Añadir día o grupo");a.onclick=()=>{garr.push({d:"Nuevo",items:[]});OP.add("g"+key+(garr.length-1));sv()};w.appendChild(a)}
return w}
function blk(t,c){const d=el("details"),k="b"+t;d.open=OP.has(k);d.ontoggle=tg(d,k);d.appendChild(el("summary",null,t));const w=el("div","p");w.appendChild(c);d.appendChild(w);return d}
function renderX(){
[["guia",$("guia")],["aulas",$("aulas")]].forEach(([key,root])=>{root.textContent="";const D=X[key];
if(!D){root.appendChild(el("div","empty","Todavía no hay contenido."));
if(ADMIN){const b=el("button","nm","Cargar contenido inicial");b.onclick=()=>setDoc(doc(db,"materias","x_"+key),SEED[key]()).catch(e=>msg("No se pudo guardar: "+e.code));root.appendChild(b)}return}
if(key==="aulas")root.appendChild(groups("aulas",D.g,FA,shA));
else{root.append(blk("Esquema semanal",groups("guia",D.g,FE,shE)),blk("Reglas para elegir qué cursar",listUI(D.reg,FR,shR,()=>saveX("guia"))),blk("Qué priorizar, choque por choque",listUI(D.cho,FC,shC,()=>saveX("guia"))))}})}
function tabs(){const t=$("tabs");t.textContent="";
[["p","📚 Preguntas"],["guia","🧭 Guía"],["aulas","🏫 Aulas"]].forEach(([k,l])=>{const b=el("button",k===TAB?"on":"",l);b.onclick=()=>{TAB=k;history.replaceState(null,"",k==="p"?location.pathname:"#"+k);tabs()};t.appendChild(b)});
$("app").classList.toggle("hide",TAB!=="p");$("guia").classList.toggle("hide",TAB!=="guia");$("aulas").classList.toggle("hide",TAB!=="aulas")}

function bar(u){const b=$("bar");b.textContent="";
if(ADMIN){b.append(el("span",null,"✔ Administrador"));
const im=el("button",null,"Importar datos"),f=document.createElement("input");f.type="file";f.accept=".json";f.style.display="none";
im.onclick=()=>two(im,"Importar datos",()=>f.click());
f.onchange=async()=>{try{const j=JSON.parse(await f.files[0].text()),bt=writeBatch(db);
j.materias.forEach((x,i)=>bt.set(doc(db,"materias",pad(i)),x));
Object.entries(j.imagenes||{}).forEach(([id,d])=>bt.set(doc(db,"imagenes",id),{d}));
await bt.commit();msg("Datos importados.")}catch(e){msg("No se pudo importar: "+(e.code||e.message))}};
const out=el("button",null,"Salir");out.onclick=()=>signOut(auth);b.append(im,f,out)}
else{b.append(el("span",null,"Puedes sugerir cambios con ✎, ✕ y «Sugerir»."));
const l=el("button",null,u?"Esta cuenta no es administradora · cambiar":"Soy administrador");
l.onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>msg("No se pudo entrar: "+e.code));b.appendChild(l)}}

onSnapshot(collection(db,"materias"),s=>{const all=s.docs.map(d=>({id:d.id,...d.data()}));S=all.filter(d=>/^m\d+$/.test(d.id)).sort((a,b)=>a.id<b.id?-1:1);X.guia=all.find(d=>d.id==="x_guia")||null;X.aulas=all.find(d=>d.id==="x_aulas")||null;render();renderSug();renderX()},e=>msg("No se pudo cargar: "+e.code));
onAuthStateChanged(auth,u=>{ADMIN=!!(u&&u.email===ADMIN_EMAIL);bar(u);
if(unsubSug){unsubSug();unsubSug=null}SUG=[];
if(ADMIN)unsubSug=onSnapshot(collection(db,"sugerencias"),s=>{SUG=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.ts-b.ts);renderSug()},e=>msg("No se pudieron leer sugerencias: "+e.code));
render();renderSug();renderX()});
tabs();renderX();
</script>
</body>
